rules:
  - id: force-auth-middleware-apiv1
    message: >
      Legacy `/api/v1/activities/categories` alias must attach AuthMiddleware
      to stay aligned with its protected OpenAPI contract.
    severity: WARNING
    languages:
      - php
    patterns:
      - pattern: |
          $GROUP->get('/activities/categories', ...);
      - pattern-not: |
          $GROUP->get('/activities/categories', ...)->add(\CarbonTrack\Middleware\AuthMiddleware::class);
      - pattern-not: |
          $GROUP->get('/activities/categories', ...)->add(AuthMiddleware::class);
    paths:
      include:
        - "/backend/src/routes.php"

  - id: detect-missing-audit-log-on-mutations
    message: >
      Controllers containing mutation hints (POST/PUT/DELETE actions or names like create/update/delete)
      must inject the AuditLogService to maintain an audit trail.
    severity: ERROR
    languages:
      - php
    patterns:
      - pattern: |
          public function $METHOD(Request $req, Response $res, array $args): Response {
            ...
          }
      - metavariable-regex:
          metavariable: $METHOD
          regex: "(?i).*(create|update|delete|post|put|patch).*"
      - pattern-not-inside: |
          class $CLASS {
            ...
            public function __construct(..., AuditLogService $X, ...) { ... }
            ...
          }
      - pattern-not-inside: |
          class $CLASS {
            ...
            public function __construct(..., \CarbonTrack\Services\AuditLogService $X, ...) { ... }
            ...
          }
    paths:
      include:
        - "/backend/src/Controllers/*.php"

  - id: forbid-plain-error-log
    message: >
      Do not rely on plain `error_log()`. Expected and unexpected failures 
      must persist exceptions/errors through ErrorLogService.
    severity: ERROR
    languages:
      - php
    patterns:
      - pattern: error_log(...)
    paths:
      include:
        - "/backend/src/**/*.php"
      exclude:
        - "/backend/src/Controllers/*.php"
        - "/backend/src/Middleware/*.php"
        - "/backend/src/dependencies.php"

  # Match each catch independently and locate the finding on its exception type.
  # Document a reviewed 4xx or best-effort fallback on the affected catch only.
  - id: enforce-errorlogservice-in-catch
    message: >-
      Persist unexpected exceptions through ErrorLogService or a controller helper
      that uses it. Document intentional fallback handlers on the catch itself.
    severity: WARNING
    languages: [php]
    patterns:
      # Existing named fallbacks are intentional. A direct server-error return
      # still needs a persistent log, regardless of the catch variable's name.
      - pattern-either:
          - patterns:
              - pattern: try { ... } catch ($TYPE $EXP) { ... }
              - metavariable-regex:
                  metavariable: $EXP
                  regex: '^(?!\$ignore(?:d)?$).*'
          - patterns:
              - pattern: try { ... } catch ($TYPE $EXP) { ... return $RESPONSE; ... }
              - metavariable-pattern:
                  metavariable: $RESPONSE
                  patterns:
                    - pattern-either:
                        - pattern: $STATUS
                        - pattern: $HANDLER->$METHOD(..., $STATUS)
                        - pattern: $RESPONSE_OBJECT->withStatus($STATUS, ...)
                    - metavariable-regex:
                        metavariable: $STATUS
                        regex: '^5[0-9]{2}$'
      - pattern-not: try { ... } catch ($TYPE $EXP) { throw $EXP; }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->logException(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->errorLogService->logException(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->errorLogService->logError(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->error(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->logError(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->logControllerException(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->handleException(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->logExceptionWithFallback(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->logBroadcastError(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... $this->logTicketUpdateFailure(...); ... }
      - pattern-not: try { ... } catch ($TYPE $EXP) { ... self::logError(...); ... }

      - focus-metavariable: $TYPE
    paths:
      include:
        - "/backend/src/Controllers/*.php"
        - "/backend/src/Jobs/*.php"
