rules:
  - id: force-auth-middleware-apiv1
    message: >
      Legacy `/api/v1/activities/categories` alias must attach AuthMiddleware
      to stay aligned with its protected OpenAPI contract.
    severity: WARNING
    languages:
      - php
    patterns:
      - pattern: |
          $GROUP->get('/activities/categories', ...);
      - pattern-not: |
          $GROUP->get('/activities/categories', ...)->add(\CarbonTrack\Middleware\AuthMiddleware::class);
      - pattern-not: |
          $GROUP->get('/activities/categories', ...)->add(AuthMiddleware::class);
    paths:
      include:
        - "/backend/src/routes.php"

  - id: detect-missing-audit-log-on-mutations
    message: >
      Controllers containing mutation hints (POST/PUT/DELETE actions or names like create/update/delete)
      must inject the AuditLogService to maintain an audit trail.
    severity: ERROR
    languages:
      - php
    patterns:
      - pattern: |
          public function $METHOD(Request $req, Response $res, array $args): Response {
            ...
          }
      - metavariable-regex:
          metavariable: $METHOD
          regex: "(?i).*(create|update|delete|post|put|patch).*"
      - pattern-not-inside: |
          class $CLASS {
            ...
            public function __construct(..., AuditLogService $X, ...) { ... }
            ...
          }
      - pattern-not-inside: |
          class $CLASS {
            ...
            public function __construct(..., \CarbonTrack\Services\AuditLogService $X, ...) { ... }
            ...
          }
    paths:
      include:
        - "/backend/src/Controllers/*.php"

  - id: forbid-plain-error-log
    message: >
      Do not rely on plain `error_log()`. Expected and unexpected failures 
      must persist exceptions/errors through ErrorLogService.
    severity: ERROR
    languages:
      - php
    patterns:
      - pattern: error_log(...)
    paths:
      include:
        - "/backend/src/**/*.php"
      exclude:
        - "/backend/src/Controllers/*.php"
        - "/backend/src/Middleware/*.php"
        - "/backend/src/dependencies.php"

  # Policy for enforce-errorlogservice-in-catch (see also the pattern-nots below):
  # A catch counts as "persisted" when it logs through ErrorLogService directly
  # ($this->errorLogService->logException) or through one of the helpers that
  # does so internally: $this->error(), $this->logError(),
  # $this->logControllerException(), $this->handleException(),
  # $this->logBroadcastError(), $this->logTicketUpdateFailure(),
  # self::logError(), or $this->logExceptionWithFallback().
  # Logging to Monolog ($this->logger / $logger, any level) also counts: the
  # failure is recorded, just not in the error_logs table (used for
  # best-effort side effects such as sending email or building asset URLs).
  # The following are deliberately NOT server errors and are excluded:
  #  - client-input exceptions (\InvalidArgumentException, \JsonException):
  #    match only the caught $TYPE with metavariable-regex. An unrelated
  #    unlogged server-error catch in the same try must still be reported.
  #  - intentional best-effort catches named $ignore / $ignored; reserve
  #    these for failures that are safe to ignore, not database 500s.
  #  - rethrows (throw $EXP), plus logging-helper failures caught as
  #    $loggingError and sent to error_log() as an emergency fallback.
  #    Ordinary catch blocks cannot use plain error_log() to pass the rule.
  # Reviewed mixed-catch client-error paths use local inline nosemgrep.
  # Revisit the suppression whenever a new catch is added to one of them.
  # Anything else must call ErrorLogService (or a helper above) in the catch.
  - id: enforce-errorlogservice-in-catch
    message: >
      Error handling blocks (catch) must persist exceptions/errors 
      through ErrorLogService, not just swallow them.
    severity: WARNING
    languages:
      - php
    patterns:
      - pattern: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->error(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->log(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logException(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $this->errorLogService->logException(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logExceptionWithFallback(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $this->logExceptionWithFallback(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logError(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logControllerException(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            self::logError(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logger->error(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            throw $EXP;
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $ignore) {
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $ignored) {
            ...
          }
      # Only error-log-service fallback handlers may use plain error_log().
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $loggingError) {
            ...
            error_log(...);
            ...
          }
      # The filter is bound to the caught type, not the entire try statement.
      - metavariable-regex:
          metavariable: $TYPE
          regex: '^(?!\\(?:InvalidArgumentException|JsonException)$).*'
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->handleException(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logBroadcastError(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logTicketUpdateFailure(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logger->warning(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logger->info(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logger->debug(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->logger->critical(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->warning(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->info(...);
            ...
          }
      - pattern-not: |
          try {
            ...
          } catch ($TYPE $EXP) {
            ...
            $X->debug(...);
            ...
          }
    paths:
      include:
        - "/backend/src/Controllers/*.php"
        - "/backend/src/Jobs/*.php"
