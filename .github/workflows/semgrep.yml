name: Semgrep

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "backend/**"
      - ".github/workflows/semgrep.yml"
      - ".semgrep/custom-rules.yml"
      - ".semgrepignore"
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - "backend/**"
      - ".github/workflows/semgrep.yml"
      - ".semgrep/custom-rules.yml"
      - ".semgrepignore"
  workflow_dispatch:
  schedule:
    - cron: "44 11 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Semgrep Pro
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_REPO_DISPLAY_NAME: ${{ github.repository }}/backend
        run: |
          if [ -z "${SEMGREP_APP_TOKEN}" ]; then
            echo "::error::SEMGREP_APP_TOKEN is required for Semgrep Pro scanning."
            exit 1
          fi

          semgrep ci --pro-languages --include=backend/ --sarif > semgrep.sarif

      - name: Run custom Semgrep rules
        if: always()
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          BASELINE_ARG=""
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASELINE_ARG="--baseline-commit=${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            BASELINE_ARG="--baseline-commit=${{ github.event.before }}"
          fi

          semgrep scan --pro --config=".semgrep/custom-rules.yml" $BASELINE_ARG --sarif backend > semgrep-custom.sarif

      - name: Normalize SARIF rule tags
        id: normalize
        if: always() && (hashFiles('semgrep.sarif') != '' || hashFiles('semgrep-custom.sarif') != '')
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for sarif_path in Path(".").glob("semgrep*.sarif"):
              try:
                  document = json.loads(sarif_path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError) as error:
                  print(f"::warning file={sarif_path}::Skipping invalid SARIF: {error}")
                  sarif_path.unlink(missing_ok=True)
                  continue

              for run in document.get("runs", []):
                  driver = run.get("tool", {}).get("driver", {})
                  for rule in driver.get("rules", []):
                      properties = rule.get("properties")
                      if not isinstance(properties, dict):
                          continue
                      tags = properties.get("tags")
                      if isinstance(tags, list) and len(tags) > 10:
                          properties["tags"] = tags[:10]

              sarif_path.write_text(
                  json.dumps(document, separators=(",", ":")),
                  encoding="utf-8",
              )
          PY

      - name: Upload SARIF
        if: always() && steps.normalize.outcome == 'success' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-backend

      - name: Upload custom-rule SARIF
        if: always() && steps.normalize.outcome == 'success' && hashFiles('semgrep-custom.sarif') != ''
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          sarif_file: semgrep-custom.sarif
          category: semgrep-backend-custom
