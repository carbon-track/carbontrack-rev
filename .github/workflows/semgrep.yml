name: Semgrep

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "backend/**"
      - ".github/workflows/semgrep.yml"
      - ".semgrep/custom-rules.yml"
      - ".semgrepignore"
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - "backend/**"
      - ".github/workflows/semgrep.yml"
      - ".semgrep/custom-rules.yml"
      - ".semgrepignore"
  workflow_dispatch:
  schedule:
    - cron: "44 11 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Semgrep Pro
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_REPO_DISPLAY_NAME: ${{ github.repository }}/backend
        run: |
          if [ -z "${SEMGREP_APP_TOKEN}" ]; then
            echo "::error::SEMGREP_APP_TOKEN is required for Semgrep Pro scanning."
            exit 1
          fi

          semgrep ci --pro-languages --include=backend/ --sarif > semgrep.sarif

      - name: Normalize SARIF rule tags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sarif_path = Path("semgrep.sarif")
          document = json.loads(sarif_path.read_text(encoding="utf-8"))
          for run in document.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              for rule in driver.get("rules", []):
                  properties = rule.get("properties")
                  if not isinstance(properties, dict):
                      continue
                  tags = properties.get("tags")
                  if isinstance(tags, list) and len(tags) > 10:
                      properties["tags"] = tags[:10]

          sarif_path.write_text(
              json.dumps(document, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Upload SARIF
        if: success()
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-backend
